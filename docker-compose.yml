version: "3.9"
# Sovereign Spatial LiDAR — docker-compose
# Usage: docker-compose up --build

services:
  spatial-lidar:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-spatial-lidar:latest
    container_name: sovereign-spatial-lidar
    restart: unless-stopped
    ports:
      - "8803:8803"
    environment:
      SBB_LIDAR_DEVICE: ${SBB_LIDAR_DEVICE}
      SBB_POINT_CLOUD_DENSITY: ${SBB_POINT_CLOUD_DENSITY}
      SBB_SEGMENTATION_MODEL: ${SBB_SEGMENTATION_MODEL}
      SBB_OUTPUT_FORMAT: ${SBB_OUTPUT_FORMAT}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8803
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8803/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
